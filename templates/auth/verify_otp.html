{% extends "base/base.html" %}

{% block auth %}

<div class="container" style="max-width: 420px; margin-top: 80px;">

    <div class="card shadow p-4 text-center">

        <h4 class="mb-3">Email Verification</h4>

        <p class="text-muted mb-4">
            Enter the 6-digit OTP sent to your email
        </p>
        <div id="otpError" class="alert alert-danger d-none"></div>
        <form method="post" id="otpForm" novalidate>
            {% csrf_token %}

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <!-- OTP BOXES -->
            <div class="d-flex justify-content-between mb-3">
                {% for i in "123456" %}
                <input type="text" maxlength="1" class="form-control text-center otp-box"
                    style="width: 50px; height: 50px; font-size: 20px;">
                {% endfor %}
            </div>

            <!-- HIDDEN REAL INPUT -->
            <input type="hidden" name="otp" id="finalOtp">

            <button type="submit" class="btn btn-primary w-100">
                Verify OTP
            </button>

        </form>

        <!-- RESEND -->
        <p class="mt-3 text-muted">
            Didn't receive code?
            <button id="resendBtn" class="btn btn-link p-0" disabled>
                Resend (<span id="timer">60</span>s)
            </button>
        </p>

    </div>

</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {

        const inputs = document.querySelectorAll(".otp-box");
        const finalOtp = document.getElementById("finalOtp");
        const form = document.getElementById("otpForm");
        const errorEl = document.getElementById("otpError");
        if (!inputs.length || !finalOtp || !form) return; // ✅ safety

        inputs.forEach((input, index) => {

            input.addEventListener("input", function () {

                this.value = this.value.replace(/\D/g, '');

                if (this.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }

                updateOTP();
            });

            input.addEventListener("keydown", function (e) {

                if (e.key === "Backspace" && !this.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        function updateOTP() {
            let otp = "";
            inputs.forEach(i => otp += i.value);
            finalOtp.value = otp;

            if (otp.length === inputs.length) {

                fetch(form.action, {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": form.querySelector('[name=csrfmiddlewaretoken]').value,
                    },
                    body: new FormData(form)
                })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            window.location.href = "/dashboard/";
                        } else {
                            errorEl.textContent = data.error || "Invalid OTP!";
                            errorEl.classList.remove("d-none");
                            // do NOT reload page → timer continues
                            inputs.forEach(i => i.value = "");
                            inputs[0].focus();
                            finalOtp.value = "";
                        }
                    })
                    .catch(err => alert(err));
            }
        }

        // ✅ Safe focus
        if (inputs[0]) inputs[0].focus();


        // =========================
        // 🔥 RESEND TIMER (SAFE)
        // =========================

        const timerEl = document.getElementById("timer");
        const resendBtn = document.getElementById("resendBtn");

        if (!timerEl || !resendBtn) return;

        let timeLeft = 60;
        let countdown;

        function startTimer(timerCount) {

            resendBtn.disabled = true;

            countdown = setInterval(() => {

                timeLeft--;
                timerCount.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = 'Resend OTP';
                }

            }, 1000);
        }

        startTimer(timerEl);

        resendBtn.addEventListener("click", function () {
            fetch("/accounts/resend-otp/")
                .then(() => {

                    clearInterval(countdown);

                    timeLeft = 60;

                    resendBtn.innerHTML = 'Resend (<span id="timer">60</span>s)';
                    const newTimer = resendBtn.querySelector("#timer");
                    if (!newTimer) return;

                    window.timerEl = newTimer;

                    startTimer(newTimer);

                    alert("OTP sent again!");

                })
                .catch(() => {
                    resendBtn.disabled = false;
                    alert("Error sending OTP");
                });

        });

    });
</script>


{% endblock %}
