{% extends "base/base.html" %}

{% block auth %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card shadow-lg p-4 text-center" style="max-width: 420px; width: 100%; border-radius: 15px;">

        <h4 class="mb-3">Continue with Google</h4>

        <p class="text-muted mb-4">
            You are about to sign in using your Google account.
        </p>

        <!-- Google Info -->
        <div class="d-flex align-items-center justify-content-center mb-4">
            <img src="https://developers.google.com/identity/images/g-logo.png" width="30" class="me-2">
            <strong>Google</strong>
        </div>

        <!-- Action Buttons -->
        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-dark w-100 mb-2">
                Continue
            </button>

            <a href="{% url 'account_login' %}" class="btn btn-outline-secondary w-100">
                Cancel
            </a>
        </form>

        <!-- Divider -->
        <hr class="my-4">

        <small class="text-muted">
            By continuing, you agree to our terms and privacy policy.
        </small>

    </div>

</div>

{% endblock %}
