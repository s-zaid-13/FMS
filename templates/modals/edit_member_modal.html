<div class="modal fade" id="editMemberModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0">

            <!-- Header -->
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-semibold">
                    Edit Member
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form method="POST" id="editMemberForm" class="edit-member-form">
                {% csrf_token %}

                <!-- Body -->
                <div class="modal-body">

                    <!-- Alert -->
                    <div class="editErrorMessage alert d-none small"></div>

                    <input type="hidden" name="member_id" id="memberId">

                    <!-- Name -->
                    <div class="mb-3">
                        <label for="memberName" class="form-label fw-medium">Full Name</label>
                        <input type="text" name="name" id="memberName" class="form-control"
                            placeholder="Enter member name">
                    </div>

                    <!-- Deposited -->
                    <div class="mb-3">
                        <label for="memberDeposited" class="form-label fw-medium">
                            Total Deposited
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">Rs</span>
                            <input type="number" name="total_deposited" id="memberDeposited" class="form-control"
                                placeholder="0">
                        </div>
                    </div>

                    <!-- Loan -->
                    <div class="mb-3">
                        <label for="memberLoan" class="form-label fw-medium">
                            Current Loan Balance
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">Rs</span>
                            <input type="number" name="current_loan_balance" id="memberLoan" class="form-control"
                                placeholder="0">
                        </div>
                    </div>

                    <!-- Status -->
                    <div class="mb-2">
                        <label for="memberStatus" class="form-label fw-medium">Status</label>
                        <select name="is_active" id="memberStatus" class="form-select">
                            <option value="True">Active</option>
                            <option value="False">Inactive</option>
                        </select>
                    </div>

                </div>

                <!-- Footer -->
                <div class="modal-footer d-flex justify-content-between">

                    <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="submit" class="btn btn-primary px-4 editSubmitBtn">
                        Save Changes
                    </button>

                </div>
            </form>

        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {

        // Populate modal fields when edit button is clicked
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const id = this.dataset.id;
                document.getElementById('memberId').value = id;
                document.getElementById('memberName').value = this.dataset.name || '';
                document.getElementById('memberDeposited').value = this.dataset.deposited || 0;
                document.getElementById('memberLoan').value = this.dataset.loan || 0;
                document.getElementById('memberStatus').value = this.dataset.active === "True" ? "True" : "False";

                document.getElementById('editMemberForm').action = `/members/admin/member/edit/${id}/`;
            });
        });

        // Handle form submission via AJAX
        const form = document.getElementById('editMemberForm');
        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const errorDiv = form.querySelector('.editErrorMessage');
            const submitBtn = form.querySelector('.editSubmitBtn');

            errorDiv.classList.add('d-none');
            errorDiv.classList.remove('alert-danger', 'alert-success');

            const name = form.elements['name'].value.trim();
            if (!name) return showError("Name is required");

            submitBtn.disabled = true;
            submitBtn.innerText = "Saving...";

            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                headers: { 'X-CSRFToken': form.querySelector('[name=csrfmiddlewaretoken]').value },
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Save";

                    if (data.success) {
                        showSuccess("Updated!");
                        const modalEl = bootstrap.Modal.getInstance(document.getElementById('editMemberModal'));
                        modalEl.hide();

                        updateRow(data.updated);
                    } else {
                        showError(data.error || "Error");
                    }
                })
                .catch(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Save";
                    showError("Server error");
                });

            function showError(msg) {
                errorDiv.classList.remove('d-none');
                errorDiv.classList.add('alert-danger');
                errorDiv.innerText = msg;
            }

            function showSuccess(msg) {
                errorDiv.classList.remove('d-none');
                errorDiv.classList.add('alert-success');
                errorDiv.innerText = msg;
            }
        });

        // Update the table row dynamically
        function updateRow(updated) {
            // Find the card's edit button by member id
            const rowBtn = document.querySelector(`.edit-btn[data-id="${updated.id}"]`);
            if (!rowBtn) return;

            const card = rowBtn.closest('.member-card');
            if (!card) return;

            // Update the content inside the card
            card.querySelector('h6').innerText = updated.name; // Name
            const depositedEl = card.querySelectorAll('strong')[0]; // Deposited
            if (depositedEl) depositedEl.innerText = updated.total_deposited;

            const loanEl = card.querySelectorAll('strong')[1]; // Loan
            if (loanEl) loanEl.innerText = updated.current_loan_balance;

            // Update the edit button's dataset for next edit
            rowBtn.dataset.name = updated.name;
            rowBtn.dataset.deposited = updated.total_deposited;
            rowBtn.dataset.loan = updated.current_loan_balance;
            rowBtn.dataset.active = updated.is_active ? "True" : "False";
        }

    });
</script>
