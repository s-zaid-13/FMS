<div class="modal fade" id="repaymentModal" tabindex="-1">

    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content shadow-lg border-0">

            <!-- Header -->
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-semibold">
                    Repayment Requests
                </h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <!-- Body -->
            <div class="modal-body p-0">

                {% if repayment_requests %}
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-light">
                            <tr>
                                <th>Loan ID</th>
                                <th>Member</th>
                                <th>Amount</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>

                        <tbody>

                            {% for r in repayment_requests %}
                            <tr id="repay-row-{{r.id}}">

                                <td>
                                    <span class="badge bg-secondary">
                                        #{{ r.loan.id }}
                                    </span>
                                </td>

                                <td>
                                    <div class="fw-medium">
                                        {{ r.loan.member.user.name }}
                                    </div>
                                    <small class="text-muted">
                                        Member ID: {{ r.loan.member.id }}
                                    </small>
                                </td>

                                <td>
                                    <span class="fw-semibold text-success">
                                        Rs {{ r.amount }}
                                    </span>
                                </td>

                                <td class="text-end">

                                    <button class="btn btn-success btn-sm approve-repay-btn px-3"
                                        data-url="{% url 'approve_repayment' r.id %}">
                                        ✓ Approve
                                    </button>

                                    <button class="btn btn-outline-danger btn-sm reject-repay-btn px-3"
                                        data-url="{% url 'reject_repayment' r.id %}">
                                        ✕ Reject
                                    </button>

                                </td>

                            </tr>
                            {% endfor %}

                        </tbody>
                    </table>
                </div>

                {% else %}
                <!-- Empty State -->
                <div class="text-center p-5">
                    <h6 class="text-muted">No pending repayment requests</h6>
                </div>
                {% endif %}

            </div>

        </div>
    </div>
</div>

<script>
    document.addEventListener('click', function (e) {
        countEl = document.getElementById("pendingRepayCount");
        if (e.target.matches(
            '.approve-repay-btn, .reject-repay-btn'
        )) {

            const button = e.target;

            const url = button.dataset.url;
            const row = button.closest('tr');

            const originalText = button.innerHTML;

            button.disabled = true;
            button.innerHTML = "Processing...";

            fetch(url, {
                method: "POST",
                headers: {
                    "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
                }
            })
                .then(res => res.json())
                .then(data => {

                    if (data.success) {

                        countEl.innerText = data.pending_count;
                        row.remove();

                    } else {

                        alert(data.error || "Error");

                        button.disabled = false;
                        button.innerHTML = originalText;
                    }

                })
                .catch(() => {

                    alert("Server error");

                    button.disabled = false;
                    button.innerHTML = originalText;
                });
        }

    });
</script>
