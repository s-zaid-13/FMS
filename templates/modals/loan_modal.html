<div class="modal fade" id="loanModal" tabindex="-1">

    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content shadow-lg border-0">

            <!-- Header -->
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-semibold">
                    Loan Requests
                </h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <!-- Body -->
            <div class="modal-body p-0">

                {% if loan_requests %}
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-light">
                            <tr>
                                <th>Member</th>
                                <th>Amount</th>
                                <th>Purpose</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>

                        <tbody>

                            {% for l in loan_requests %}
                            <tr id="loan-row-{{l.id}}">

                                <td>
                                    <div class="fw-medium">{{ l.member.user.name }}</div>
                                    <small class="text-muted">ID: {{ l.member.id }}</small>
                                    <small class="text-muted">(repay_in: {{ l.repayment_months }}months)</small>
                                </td>

                                <td>
                                    <span class="fw-semibold text-danger">
                                        Rs {{ l.amount }}
                                    </span>
                                </td>

                                <td>
                                    <span class="text-muted">
                                        {{ l.reason }}
                                    </span>
                                </td>

                                <td class="text-end">

                                    <button class="btn btn-success btn-sm approve-loan-btn px-3"
                                        data-url="{% url 'approve_loan' l.id %}">
                                        ✓ Approve
                                    </button>

                                    <button class="btn btn-outline-danger btn-sm reject-loan-btn px-3"
                                        data-url="{% url 'reject_loan' l.id %}">
                                        ✕ Reject
                                    </button>

                                </td>

                            </tr>
                            {% endfor %}

                        </tbody>
                    </table>
                </div>

                {% else %}
                <!-- Empty State -->
                <div class="text-center p-5">
                    <h6 class="text-muted">No pending loan requests</h6>
                </div>
                {% endif %}

            </div>

        </div>
    </div>
</div>

<script>
    document.addEventListener('click', function (e) {
        countEl = document.getElementById("pendingLoanCount");
        // LOAN APPROVE
        if (e.target.classList.contains('approve-loan-btn')) {
            handleAction(e.target, "Approve");
        }

        // LOAN REJECT
        if (e.target.classList.contains('reject-loan-btn')) {
            handleAction(e.target, "Reject");
        }

        function handleAction(button, label) {
            if (button.disabled) return;
            const url = button.dataset.url;
            const row = button.closest('tr');

            button.disabled = true;
            button.innerHTML = "Processing...";

            fetch(url, {
                method: "POST",
                headers: {
                    "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
                }
            })
                .then(res => res.json())
                .then(data => {

                    if (data.success) {

                        // 🔥 remove row
                        countEl.innerText = data.pending_count;
                        row.remove();

                    } else {

                        alert(data.error || "Error");

                        button.disabled = false;
                        button.innerHTML = label;
                    }

                })
                .catch(() => {

                    alert("Server error");

                    button.disabled = false;
                    button.innerHTML = label;
                });
        }

    });
</script>
